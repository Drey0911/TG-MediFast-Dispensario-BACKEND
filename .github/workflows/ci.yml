name: Backend CI

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main", "develop" ]

# Evita duplicar ejecuciones por rama y cancela las anteriores
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validar-python:
    name: Validar entorno Python e instalar dependencias
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: [ "3.11" ]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Cache de pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verificar sintaxis del proyecto
        run: |
          python -m compileall -q .

      - name: Comprobar consistencia de dependencias
        run: |
          python -m pip check

  build-docker:
    name: Construir imagen Docker
    runs-on: ubuntu-latest
    needs: validar-python
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Construir imagen
        run: |
          docker build -t medifast-backend:ci .